<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>낚시 제목 공장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg1:#f6fbff;--bg2:#d5f2ff;--fg:#161616;--mute:#5a6b7a;--line:#bfe6f7;--soft:#d5f2ff;--blue:#00aaff;--ink:#0b6ca5;--ok:#e3f6ea;--err:#ffe5e0;--warn:#fff4d6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--fg);background:linear-gradient(160deg,var(--bg1),var(--bg2));line-height:1.5}
.container{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.wide{max-width:1100px}
h1{font-size:2.2rem;font-weight:900;margin:0 0 6px;line-height:1.15}
h1 b{color:var(--blue)}
h2{font-size:1.05rem;margin:0 0 8px}
.muted{color:var(--mute)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:999px;padding:6px 14px;color:var(--ink);font-weight:700;margin-bottom:12px}
.head span:last-child{font-weight:500;font-size:.9rem}
.fact{font-size:1.15rem;font-weight:700;padding:14px;border-radius:12px;background:#eef9ff;border:1.5px dashed var(--line)}
.timer{font-size:3.4rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}.danger{color:#d4442c}
button{font:inherit;border:0;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
button.secondary{background:var(--soft);color:var(--ink)}
button:disabled{background:#c8d6df;color:#5a6b7a;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
input,select{font:inherit;width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--fg)}
.notice{padding:12px 14px;border-radius:12px;background:var(--warn);margin:10px 0}.success{background:var(--ok)}.error{background:var(--err)}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:.8rem;font-weight:700;margin-right:4px}
.small{font-size:.85rem}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.names button{background:#fff;color:var(--fg);border:1.5px solid var(--line);padding:12px 8px}
.names button:active{background:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.title-row{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.title-row .t{flex:1 1 240px;min-width:0;font-weight:700;word-break:break-word}
.qrbig{display:grid;place-items:center;gap:6px}.qrbig img{width:min(70vw,300px);height:auto;border-radius:12px;border:1.5px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right}
.tech{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tech button.used{background:#c8d6df;color:#5a6b7a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.no{display:inline-block;min-width:28px;text-align:center;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);font-weight:900;margin-right:8px}
.title-row.mine{background:#eef9ff}.title-row.pick{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}.title-row.win{background:#fff4d6;border-color:#e8a200}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw9qiMmqJ6VBi2TAqzkdw16myczlwyKxRUVM9JJeE_-9wsh8cjLURAKQYh_kdn02XQ/exec";
const FACT = "중앙도서관 대출 가능 권수가 5권에서 7권으로 늘어납니다.";
const PEOPLE = [{"id": "P01", "group": "1조", "name": "강태웅"}, {"id": "P02", "group": "1조", "name": "김준영"}, {"id": "P03", "group": "1조", "name": "생캄"}, {"id": "P04", "group": "1조", "name": "염윤호"}, {"id": "P05", "group": "1조", "name": "이정"}, {"id": "P06", "group": "3조", "name": "김동준"}, {"id": "P07", "group": "3조", "name": "이한슬"}, {"id": "P08", "group": "3조", "name": "정상윤"}, {"id": "P09", "group": "3조", "name": "허준"}, {"id": "P10", "group": "4조", "name": "금시영"}, {"id": "P11", "group": "4조", "name": "김민수"}, {"id": "P12", "group": "4조", "name": "김민준"}, {"id": "P13", "group": "4조", "name": "신주환"}, {"id": "P14", "group": "4조", "name": "유지"}, {"id": "P15", "group": "5조", "name": "강소은"}, {"id": "P16", "group": "5조", "name": "권진환"}, {"id": "P17", "group": "5조", "name": "이시영"}, {"id": "P18", "group": "6조", "name": "배윤서"}, {"id": "P19", "group": "6조", "name": "이서준"}, {"id": "P20", "group": "6조", "name": "이설리"}, {"id": "P21", "group": "6조", "name": "최민서"}];
const BASE = location.href.split("?")[0].split("#")[0];
function qs(k){return new URLSearchParams(location.search).get(k)}
const mode = qs("mode") || "student";
const pid = qs("pid");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function $(id){return document.getElementById(id)}
function api(action, data={}){
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data})}).then(r=>r.json());
}
function apiGet(action){return fetch(API_URL+"?action="+encodeURIComponent(action)).then(r=>r.json())}
function qrImg(url,size){return "https://quickchart.io/qr?size="+size+"&text="+encodeURIComponent(url)}

/* ---------- 학생 화면 ---------- */
function titleBlock(){
  return `<h1>낚시 제목 <b>공장</b></h1>
  <div class="card"><div class="head"><span>사실</span><span>같은 사실, 다른 제목</span></div>
  <div class="fact">${esc(FACT)} <span class="small muted">(가상 사례)</span></div>
  <p class="muted small">사실은 그대로 두고 표현만 바꿔서 가장 낚이는 제목을 만드세요.</p></div>`;
}
function pickPage(){
  const groups=[...new Set(PEOPLE.map(p=>p.group))];
  $("app").innerHTML=`<div class="container">${titleBlock()}
  <div class="card"><div class="head"><span>내 이름 고르기</span><span>한 번만 누르세요</span></div>
  ${groups.map(g=>`<h2>${esc(g)}</h2><div class="names">${PEOPLE.filter(p=>p.group===g).map(p=>`<button data-p="${p.id}">${esc(p.name)}</button>`).join("")}</div>`).join('<div style="height:10px"></div>')}
  </div></div>`;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    try{localStorage.setItem("najj_pid",b.dataset.p)}catch(e){}
    location.href=BASE+"?mode=student&pid="+encodeURIComponent(b.dataset.p);
  });
}
let ME=null,ST=null;
function studentPage(){
  let id=pid;
  if(!id){try{id=localStorage.getItem("najj_pid")}catch(e){}}
  if(!id||qs("pick")){pickPage();return}
  ME=PEOPLE.find(x=>x.id===id);
  if(!ME){pickPage();return}
  $("app").innerHTML=`<div class="container">${titleBlock()}<div id="main"></div>
  <p class="small"><button class="secondary" id="notme">내 이름이 아니에요</button></p></div>`;
  $("notme").onclick=()=>{try{localStorage.removeItem("najj_pid")}catch(e){};location.href=BASE+"?mode=student&pick=1"};
  loadState();setInterval(loadState,3000);
}
async function loadState(){
  try{ST=await api("state",{pid:ME.id});renderStudent()}
  catch(e){if(!ST)$("main").innerHTML='<div class="card"><div class="notice error">서버 연결에 실패했습니다. 잠시 뒤 다시 시도해 주세요.</div></div>'}
}
function renderStudent(){
  const m=$("main");
  if(!ST.ok){m.innerHTML=`<div class="card"><div class="notice error">${esc(ST.message||"오류가 발생했습니다.")}</div></div>`;return}
  if(!ST.submitted){
    if(!$("title")){
      m.innerHTML=`<div class="card"><div class="head"><span>내 제목 제출</span><span><span class="pill" style="margin:0">${esc(ME.group)} · ${esc(ME.name)}</span></span></div>
      <div class="notice"><b>한 번 제출하면 바꿀 수 없습니다.</b><br>제출 전에 오탈자와 표현을 확인하세요.</div>
      <input id="title" maxlength="120" placeholder="가장 낚이는 제목을 입력하세요" autocomplete="off">
      <div class="row" style="margin-top:10px"><button id="submitBtn">제출하기</button></div><div id="msg"></div>
      <p class="small muted">제출 현황: ${ST.count}/${ST.total}</p></div>`;
      $("submitBtn").onclick=submitTitle;
    }
    return;
  }
  const res=ST.phase==="result";
  const max=Math.max(0,...ST.submissions.map(s=>s.votes||0));
  const rows=(res?ST.submissions.slice().sort((a,b)=>(b.votes||0)-(a.votes||0)||a.no-b.no):ST.submissions).map(s=>{
    const mine=s.no===ST.myNo,pick=s.no===ST.myVote,win=res&&max>0&&s.votes===max;
    let right="";
    if(res)right=`<b>${s.votes}표</b>`;
    else if(mine)right='<span class="pill">내 제목</span>';
    else right=`<button data-vote="${s.no}" ${pick?'class="secondary"':''}>${pick?"✓ 내 선택":"투표"}</button>`;
    return `<div class="title-row${mine?" mine":""}${pick&&!res?" pick":""}${win?" win":""}"><div class="t"><span class="no">${s.no}</span>${esc(s.title)}${res?` <span class="small muted">${esc(s.group)} · ${esc(s.name)}</span>`:""}</div>${right}</div>`;
  }).join("");
  m.innerHTML=`<div class="card"><div class="head"><span>${res?"투표 결과":"제출 현황 · 투표"}</span><span>제출 ${ST.count}/${ST.total} · 투표 ${ST.voters}명</span></div>
  ${res?'<div class="notice success"><b>결과가 공개되었습니다.</b></div>':'<div class="notice success"><b>제출 완료!</b> 내 제목을 뺀 가장 클릭하고 싶은 제목 <b>1개</b>에 투표하세요. 결과 공개 전에는 다시 눌러 바꿀 수 있습니다.</div>'}
  <div id="vmsg"></div>${rows||'<p class="muted">아직 제목이 없습니다.</p>'}
  ${res?"":'<p class="small muted">다른 사람이 제출하면 목록이 자동으로 늘어납니다.</p>'}</div>`;
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>castVote(Number(b.dataset.vote)));
}
async function submitTitle(){
  const input=$("title"),btn=$("submitBtn"),msg=$("msg"),title=input.value.trim();
  if(!title){msg.innerHTML='<div class="notice error">제목을 입력해 주세요.</div>';return}
  btn.disabled=true;
  try{
    const r=await api("submit",{pid:ME.id,title});
    if(r.ok){await loadState()}
    else{btn.disabled=false;msg.innerHTML='<div class="notice error">'+esc(r.message||"제출할 수 없습니다.")+'</div>'}
  }catch(e){btn.disabled=false;msg.innerHTML='<div class="notice error">서버 연결에 실패했습니다. 잠시 뒤 다시 눌러 주세요.</div>'}
}
async function castVote(no){
  try{
    const r=await api("vote",{pid:ME.id,no});
    if(!r.ok){const v=$("vmsg");if(v)v.innerHTML='<div class="notice error">'+esc(r.message||"투표할 수 없습니다.")+'</div>'}
    await loadState();
  }catch(e){}
}

/* ---------- 진행자 화면 ---------- */
let timerEnd=0,timerHandle=null;
function startTimer(sec){
  timerEnd=Date.now()+sec*1000;
  try{localStorage.setItem("najj_timer_end",String(timerEnd))}catch(e){}
  updateTimer();clearInterval(timerHandle);timerHandle=setInterval(updateTimer,250);
}
function updateTimer(){
  const el=$("timer");if(!el)return;
  const s=Math.ceil(Math.max(0,timerEnd-Date.now())/1000);
  el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  el.classList.toggle("danger",s<=30&&timerEnd>0);
  if(s<=0)clearInterval(timerHandle);
}
let KEY="",TS=null,techUsed={},techPts={},hideAuthor=true;
const TECHS=["숫자","감정 자극","일부 가림","급박함"];
function teacherPage(){
  KEY=qs("key")||"";
  if(!KEY){try{KEY=localStorage.getItem("najj_key")||""}catch(e){}}
  if(!KEY)KEY=prompt("진행자 비밀번호를 입력하세요")||"";
  try{localStorage.setItem("najj_key",KEY)}catch(e){}
  $("app").innerHTML=`<div class="container wide">
  <h1>낚시 제목 <b>공장</b> · 진행자</h1>
  <div class="two"><div class="card"><div class="head"><span>타이머</span><span>제목 쓰기</span></div>
    <div id="timer" class="timer">5:00</div>
    <div class="row" style="justify-content:center;margin-top:8px"><button id="t5">5분 시작</button><button class="secondary" id="t10">10분</button></div></div>
  <div class="card"><div class="head"><span>참가 QR</span><span>하나로 모두 참여</span></div>
    <div class="qrbig"><img id="mainqr" alt="참가 QR"><div class="small muted">찍고 자기 이름을 누르세요</div></div></div></div>
  <div class="card"><div class="head"><span>진행 상황</span><span id="count"></span></div>
    <div class="row"><button id="reveal">결과 공개</button><button class="secondary" id="reopen">투표 다시 열기</button><label class="small"><input type="checkbox" id="hid" checked style="width:auto"> 공개 전 작성자 숨기기</label></div>
    <div id="msg"></div>
    <p class="muted small">참여자는 폰에서 제출하고 바로 투표합니다. 진행자는 결과 공개만 누르면 됩니다.</p></div>
  <div class="card"><div class="head"><span>제목 목록</span><span id="phase"></span></div><div id="titles">불러오는 중...</div></div>
  <div class="card"><div class="head"><span>기법 맞히기</span><span>+1점</span></div>
    <p class="muted small">1위 본인은 참여할 수 없고, 같은 기법은 한 번만 인정합니다.</p>
    <div class="row"><select id="guesser" style="max-width:260px"></select></div>
    <div class="tech" id="tech"></div></div>
  <div class="card"><div class="head"><span>점수</span><span>결과 공개 후 표시</span></div><div id="score"></div></div></div>`;
  $("mainqr").src=qrImg(BASE+"?mode=student",300);
  $("t5").onclick=()=>startTimer(300);$("t10").onclick=()=>startTimer(600);
  $("hid").onchange=e=>{hideAuthor=e.target.checked;renderTeacher()};
  $("reveal").onclick=()=>setPhase("result");$("reopen").onclick=()=>setPhase("open");
  $("guesser").innerHTML=PEOPLE.map(p=>`<option value="${p.id}">${esc(p.group)} ${esc(p.name)}</option>`).join("");
  const saved=Number((()=>{try{return localStorage.getItem("najj_timer_end")}catch(e){return 0}})()||0);
  if(saved>Date.now()){timerEnd=saved;timerHandle=setInterval(updateTimer,250);updateTimer()}
  loadTeacher();setInterval(loadTeacher,3000);
}
async function setPhase(ph){
  try{const r=await api("setPhase",{key:KEY,phase:ph});if(!r.ok)$("msg").innerHTML='<div class="notice error">'+esc(r.message)+'</div>';await loadTeacher()}catch(e){}
}
async function loadTeacher(){
  try{
    const r=await api("teacherState",{key:KEY});
    if(!r.ok){$("titles").innerHTML='<div class="notice error">'+esc(r.message||"불러오지 못했습니다.")+' (주소 끝에 &key=비밀번호)</div>';return}
    TS=r;renderTeacher();
  }catch(e){$("titles").innerHTML='<div class="notice error">서버에서 불러오지 못했습니다.</div>'}
}
function renderTeacher(){
  if(!TS)return;
  const res=TS.phase==="result";
  $("count").textContent=`제출 ${TS.count}/${TS.total} · 투표 ${TS.voters}명`;
  $("phase").textContent=res?"결과 공개됨":"투표 진행 중";
  $("reveal").disabled=res;$("reopen").disabled=!res;
  const max=Math.max(0,...TS.submissions.map(s=>s.votes));
  const list=res?TS.submissions.slice().sort((a,b)=>b.votes-a.votes||a.no-b.no):TS.submissions;
  $("titles").innerHTML=list.length?list.map(s=>{
    const win=res&&max>0&&s.votes===max;
    const who=(res||!hideAuthor)?` <span class="small muted">${esc(s.group)} · ${esc(s.name)}</span>`:"";
    return `<div class="title-row${win?" win":""}"><div class="t"><span class="no">${s.no}</span>${esc(s.title)}${who}</div>${res?`<b>${s.votes}표</b>`:""}</div>`;
  }).join(""):'<p class="muted">아직 제출된 제목이 없습니다.</p>';
  $("tech").innerHTML=TECHS.map(t=>`<button data-t="${t}" class="${techUsed[t]?"used":""}">${t}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;if(techUsed[t])return;
    const g=$("guesser").value;techUsed[t]=g;techPts[g]=(techPts[g]||0)+1;renderTeacher()});
  renderScore(res,max);
}
function renderScore(res,max){
  if(!res){$("score").innerHTML='<p class="muted small">“결과 공개”를 누르면 점수가 보입니다.</p>';return}
  const pts={};PEOPLE.forEach(p=>pts[p.id]=0);
  const winners=TS.submissions.filter(s=>max>0&&s.votes===max);
  winners.forEach(w=>{
    pts[w.pid]+=3;
    PEOPLE.filter(p=>p.group===w.group&&p.id!==w.pid).forEach(p=>pts[p.id]+=1);
  });
  Object.keys(techPts).forEach(id=>pts[id]+=techPts[id]);
  const people=PEOPLE.map(p=>({...p,s:pts[p.id]})).sort((a,b)=>b.s-a.s);
  const gs={};people.forEach(p=>gs[p.group]=(gs[p.group]||0)+p.s);
  const groups=Object.entries(gs).sort((a,b)=>b[1]-a[1]);
  $("score").innerHTML=`<div class="two"><div><h2>조별 합계</h2><table><tr><th>조</th><th class="n">점수</th></tr>${groups.map(([g,s])=>`<tr><td>${esc(g)}</td><td class="n"><b>${s}</b></td></tr>`).join("")}</table></div>
  <div><h2>개인 상위 5</h2><table><tr><th>이름</th><th>조</th><th class="n">점수</th></tr>${people.slice(0,5).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.group)}</td><td class="n"><b>${p.s}</b></td></tr>`).join("")}</table></div></div>
  ${winners.length>1?'<p class="muted small">득표가 같으면 공동 1위로 모두 같은 점수를 받습니다.</p>':""}`;
}
if(mode==="teacher")teacherPage();else studentPage();
</script>
</body>
</html>
